name: Build site

on:
  push:
    branches: [source]
    # Environment changes are handled by docker-image.yml, which triggers this
    # workflow through workflow_run once the new image is pushed.
    paths-ignore:
      - Dockerfile
      - requirements.txt
      - .github/workflows/docker-image.yml
  workflow_run:
    workflows: [Build environment image]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/hustmphrrr/site-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          ref: source
          path: src
          submodules: true

      - name: Check out published site
        uses: actions/checkout@v4
        with:
          ref: master
          path: site

      - name: Build
        working-directory: src
        run: ./build.sh -o "$GITHUB_WORKSPACE/out"

      - name: Publish to master
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE/site"
          rsync -a --delete --exclude .git out/ site/
          touch site/.nojekyll
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Build from source@$(git -C ../src rev-parse --short HEAD)"
            git push origin HEAD:master
          fi
